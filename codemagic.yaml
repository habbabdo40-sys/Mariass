workflows:
  android-workflow:
    name: Mariass Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: تثبيت الحزم
        script: |
          cd mariass_app
          flutter pub get
      - name: بناء APK
        script: |
          cd mariass_app
          flutter build apk --release
    artifacts:
      - mariass_app/build/app/outputs/flutter-apk/*.apk
